<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hold test 3</title>
<link rel="stylesheet" href="https://httpbin.org/delay/9?css=1">
<link rel="stylesheet" href="https://postman-echo.com/delay/9?css=1">
</head>
<body>
<h1>Hold test 3</h1>
<p id="clock">clock: not started</p>
<p id="events">events:</p>
<script>
(function () {
  var t0 = performance.now();
  var clock = document.getElementById('clock');
  var events = document.getElementById('events');
  function ms() { return Math.round(performance.now() - t0); }
  function note(text) { events.textContent += ' [' + ms() + ' ms: ' + text + ']'; }
  setInterval(function () { clock.textContent = 'clock: ' + ms() + ' ms; readyState=' + document.readyState; }, 100);
  note('script started, readyState=' + document.readyState);
  window.addEventListener('load', function () { note('window load'); });
  var urls = ['https://httpbin.org/delay/8?n=1', 'https://httpbin.org/delay/8?n=2', 'https://httpbin.org/delay/8?n=3', 'https://postman-echo.com/delay/8?n=1', 'https://postman-echo.com/delay/8?n=2', 'https://postman-echo.com/delay/8?n=3'];
  urls.forEach(function (u, i) {
    var started = performance.now();
    fetch(u).then(function (r) { note('fetch ' + i + ' status ' + r.status + ' after ' + Math.round(performance.now() - started)); }).catch(function (e) { note('fetch ' + i + ' failed after ' + Math.round(performance.now() - started) + ': ' + e.message); });
  });
})();
</script>
</body>
</html>
