<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>probe</title></head>
<body>
<h1>PeerJS probe</h1>
<p id="clock">elapsed: 0.0 s</p>
<ul id="out"></ul>
<script src="vendor/peerjs.min.js"></script>
<script>
const t0 = performance.now();
const ms = () => Math.round(performance.now() - t0);
const out = document.getElementById('out');
function log(text) { const li = document.createElement('li'); li.textContent = `[${ms()} ms] ${text}`; out.appendChild(li); }
setInterval(() => { document.getElementById('clock').textContent = 'elapsed: ' + (ms() / 1000).toFixed(1) + ' s'; }, 200);
// держим «сетевую активность», пока идут проверки: некоторые средства просмотра делают снимок страницы, как только сеть затихает
let busyN = 0;
const busy = setInterval(() => { if (ms() > 14000) { clearInterval(busy); log('keep-busy stopped, requests: ' + busyN); return; } busyN++; fetch('vendor/peerjs.min.js?busy=' + busyN + '&t=' + Date.now(), { cache: 'no-store', method: 'HEAD' }).catch(() => {}); }, 200);
log('UA: ' + navigator.userAgent);
log('RTCPeerConnection: ' + (typeof RTCPeerConnection) + ', WebSocket: ' + (typeof WebSocket) + ', secure context: ' + window.isSecureContext);

// A. сигнальный сервер PeerJS Cloud
const a = new Peer({ debug: 1 });
a.on('error', (e) => log('A error: ' + e.type + ' — ' + e.message));
a.on('disconnected', () => log('A disconnected from signaling'));
a.on('open', (id) => {
  log('A: signaling OPEN, id=' + id);
  a.on('connection', (c) => { c.on('open', () => log('A: incoming data channel open')); c.on('data', (d) => { log('A got: ' + JSON.stringify(d)); c.send({ echo: d, at: ms() }); }); });
  // B. второй пир в той же странице подключается к первому
  const b = new Peer({ debug: 1 });
  b.on('error', (e) => log('B error: ' + e.type + ' — ' + e.message));
  b.on('open', (bid) => {
    log('B: signaling OPEN, id=' + bid);
    const c = b.connect(id, { reliable: true, serialization: 'json' });
    c.on('open', async () => {
      log('B: data channel OPEN → send ping');
      c.send({ ping: 'привет', at: ms() });
      try {
        const stats = await c.peerConnection.getStats(); let pair = null; const cands = {};
        stats.forEach((s) => { if (s.type === 'local-candidate' || s.type === 'remote-candidate') cands[s.id] = s; });
        stats.forEach((s) => { if (s.type === 'candidate-pair' && (s.selected || s.nominated) && s.state === 'succeeded') pair = s; });
        if (pair) log('B: selected pair: local=' + (cands[pair.localCandidateId] || {}).candidateType + ' remote=' + (cands[pair.remoteCandidateId] || {}).candidateType + ' proto=' + (cands[pair.localCandidateId] || {}).protocol);
      } catch (e) { log('stats error ' + e.message); }
    });
    c.on('data', (d) => log('B got echo: ' + JSON.stringify(d) + ' → P2P LOOP OK'));
    c.on('error', (e) => log('B conn error: ' + e.type));
    // C. несуществующий пир
    const tMiss = ms();
    const onErr = (e) => { if (e.type === 'peer-unavailable') log('B: peer-unavailable for missing id after ' + (ms() - tMiss) + ' ms'); };
    b.on('error', onErr);
    b.connect('swc-probe-missing-' + Math.random().toString(36).slice(2), { reliable: true });
  });
});

// D. STUN / TURN: какие кандидаты удаётся собрать
function gather(label, config) {
  try {
    const pc = new RTCPeerConnection(config); const types = {};
    pc.createDataChannel('x');
    pc.onicecandidate = (e) => {
      if (e.candidate) { const m = / typ (\w+)/.exec(e.candidate.candidate); const t = m ? m[1] : '?'; types[t] = (types[t] || 0) + 1; if (types[t] === 1) log(label + ': candidate typ ' + t); }
      else { log(label + ': gathering complete → ' + JSON.stringify(types)); pc.close(); }
    };
    pc.onicecandidateerror = (e) => log(label + ': candidate error ' + e.errorCode + ' ' + (e.errorText || '') + ' ' + (e.url || ''));
    pc.createOffer().then((o) => pc.setLocalDescription(o)).catch((e) => log(label + ': offer error ' + e.message));
  } catch (e) { log(label + ': exception ' + e.message); }
}
gather('STUN google', { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
gather('TURN peerjs eu (relay only)', { iceServers: [{ urls: ['turn:eu-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }], iceTransportPolicy: 'relay' });
gather('TURN peerjs us (relay only)', { iceServers: [{ urls: ['turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }], iceTransportPolicy: 'relay' });
</script>
</body></html>
